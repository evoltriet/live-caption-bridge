name: Draft Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:e2e
      - run: pnpm dist:win
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop-host/release -File | Where-Object Extension -In '.exe', '.zip' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding utf8 apps/desktop-host/release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/desktop-host/release/*.exe
            apps/desktop-host/release/*.zip
            apps/desktop-host/release/SHA256SUMS.txt
